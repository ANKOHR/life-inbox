[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-inbox"
version = "0.1.0"
description = "Deterministic local capture and triage for life's inputs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
li = "life_inbox.cli:main"

[tool.setuptools.packages.find]
include = ["life_inbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
